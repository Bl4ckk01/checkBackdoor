# Prepara una release quando si pubblica un tag "v1.2.0": test, app autonoma, installatore,
# script e impronte SHA-256. La release resta in BOZZA: la pubblica una persona dopo averla
# controllata. Se i segreti del certificato esistono, firma app, script e installatore.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Strumenti
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          choco install innosetup -y --no-progress

      - name: Il tag corrisponde alla versione
        shell: powershell
        run: |
          $v = [regex]::Match((Get-Content CheckBackdoor.ps1 -Raw), "\`$Version = '([\d.]+)'").Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Il tag $env:GITHUB_REF_NAME non corrisponde alla versione $v" }

      - name: Costruisci (e firma, se c'e' il certificato)
        shell: powershell
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $sign = @{}
          if ($env:SIGNING_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'firma.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $sign = @{ PfxPath = $pfx; PfxPassword = $env:SIGNING_PFX_PASSWORD }
          }
          .\tools\Build-Release.ps1 @sign
          if ($pfx) { Remove-Item $pfx -Force }

      - name: Bozza della release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'note.md'
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($v)).*?(?=^## |\z)")
          Set-Content -Path $notes -Value $(if ($m.Success) { $m.Value } else { "CheckBackdoor $v" }) -Encoding utf8
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist -File).FullName --draft --title "CheckBackdoor $v" --notes-file $notes
