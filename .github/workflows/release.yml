# Prepares a release when a "v1.4.0" tag is pushed: tests, self-contained app, installer,
# scripts and SHA-256 hashes. The release stays a DRAFT: a person publishes it after
# checking it. If the certificate secrets exist, it signs the app, scripts and installer.
name: Release

on:
  push:
    tags: ['v*']

# Actions are pinned to a commit (the version number is in the comment): a tag like "v4"
# can be moved to other code, a commit cannot. id-token and attestations are needed
# for the provenance attestation of the release files.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Tools
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          choco install innosetup --version 6.7.1 -y --no-progress

      - name: The tag matches the version
        shell: powershell
        run: |
          $v = [regex]::Match((Get-Content CheckBackdoor.ps1 -Raw), "\`$Version = '([\d.]+)'").Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "The tag $env:GITHUB_REF_NAME does not match the version $v" }

      - name: Build (and sign, if there is a certificate)
        shell: powershell
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $sign = @{}
          if ($env:SIGNING_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $sign = @{ PfxPath = $pfx; PfxPassword = $env:SIGNING_PFX_PASSWORD }
          }
          .\tools\Build-Release.ps1 @sign
          if ($pfx) { Remove-Item $pfx -Force }

      # Whoever downloads can verify the file was built here, from this commit:
      #   gh attestation verify CheckBackdoor-<version>-setup.exe --repo <owner>/<repository>
      - name: Provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.zip
            dist/*.exe

      - name: Draft release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($v)).*?(?=^## |\z)")
          Set-Content -Path $notes -Value $(if ($m.Success) { $m.Value } else { "CheckBackdoor $v" }) -Encoding utf8
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist -File).FullName --draft --title "CheckBackdoor $v" --notes-file $notes
