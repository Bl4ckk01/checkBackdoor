# Esegue tutti i test a ogni push e pull request, con Windows PowerShell 5.1:
# la stessa versione con cui CheckBackdoor gira sui PC degli utenti.
name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  motore:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Installa Pester
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Esegui i test
        shell: powershell
        run: .\tests\Invoke-Tests.ps1 -CI

      - name: Salva i risultati
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risultati-test
          path: testResults.xml
          if-no-files-found: ignore

  # L'app con interfaccia: compila e lancia una verifica vera senza finestra (--smoke),
  # per controllare che app e motore si parlino davvero.
  app:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compila
        shell: powershell
        run: dotnet build app\CheckBackdoor.App\CheckBackdoor.App.csproj -c Release

      - name: Verifica di prova senza finestra
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'smoke'
          $exe = 'app\CheckBackdoor.App\bin\Release\net10.0-windows\CheckBackdoor.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke', "`"$out`"" -Wait -PassThru
          Get-Content (Join-Path $out 'smoke.log')
          if ($p.ExitCode -ne 0) { throw "Verifica di prova fallita (codice $($p.ExitCode))" }
